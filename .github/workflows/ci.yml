name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Explicit file: newer Node versions do not accept a directory here.
      - run: node --test .claude/hooks/block-ai-credit.test.js

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Rust project
        id: detect
        shell: bash
        run: |
          if [ -f src-tauri/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: steps.detect.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: pinned-binaries-${{ runner.os }}-${{ hashFiles('scripts/pinned-binaries.json') }}
      - if: steps.detect.outputs.present == 'true'
        shell: pwsh
        run: ./scripts/fetch-pinned-binaries.test.ps1
      - if: steps.detect.outputs.present == 'true'
        shell: pwsh
        run: ./scripts/fetch-pinned-binaries.ps1
      - if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: steps.detect.outputs.present == 'true'
        working-directory: src-tauri
        run: cargo fmt --check
      - if: steps.detect.outputs.present == 'true'
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - if: steps.detect.outputs.present == 'true'
        working-directory: src-tauri
        run: cargo test

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        run: pnpm run lint
      - if: steps.detect.outputs.present == 'true'
        run: pnpm run check
      - if: steps.detect.outputs.present == 'true'
        run: pnpm run test
      - if: steps.detect.outputs.present == 'true'
        run: pnpm run build
