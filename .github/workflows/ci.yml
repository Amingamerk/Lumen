name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Rust project
        id: detect
        shell: bash
        run: |
          if [ -f src-tauri/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: steps.detect.outputs.present == 'true'
        working-directory: src-tauri
        run: cargo fmt --check
      - if: steps.detect.outputs.present == 'true'
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - if: steps.detect.outputs.present == 'true'
        working-directory: src-tauri
        run: cargo test

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        run: pnpm run lint
      - if: steps.detect.outputs.present == 'true'
        run: pnpm run check
      - if: steps.detect.outputs.present == 'true'
        run: pnpm run test
