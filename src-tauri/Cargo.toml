[package]
name = "lumen"
version = "0.1.0"
description = "Lightweight Windows desktop music player"
edition = "2024"
publish = false

[lib]
# Suffixed so the library does not clash with the `lumen` binary on Windows.
name = "lumen_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
# Reads the HTTP-date form of `Retry-After`.
httpdate = "1"
# The `keyring` project's core and Windows store, used directly: `keyring`'s own
# `Entry` cannot set a credential's persistence.
keyring-core = "1"
# libmpv-2.dll comes from scripts/fetch-pinned-binaries.ps1; build.rs links it.
libmpv2 = { version = "7", default-features = false }
# The Windows TLS stack; no cookie store, system proxy or retries of its own.
reqwest = { version = "0.13", default-features = false, features = ["gzip", "http2", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `SAPISIDHASH`, the web client's request signature.
sha1 = "0.11"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
thiserror = "2"
# The calendar date in the web client's version.
time = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = { version = "1", features = ["serde"] }
windows-native-keyring-store = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# The lean settings the Milestone 0 RAM baseline was measured with, minus
# `panic = "abort"`: unwinding must stay on so RAII cleanup guards run.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
