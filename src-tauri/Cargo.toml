[package]
name = "lumen"
version = "0.1.0"
description = "Lightweight Windows desktop music player"
edition = "2024"
publish = false

[lib]
# Suffixed so the library does not clash with the `lumen` binary on Windows.
name = "lumen_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
serde_json = "1"

# The lean settings the Milestone 0 RAM baseline was measured with, minus
# `panic = "abort"`: unwinding must stay on so RAII cleanup guards run.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
