[package]
name = "lumen"
version = "0.1.0"
description = "Lightweight Windows desktop music player"
edition = "2024"
publish = false

[lib]
# Suffixed so the library does not clash with the `lumen` binary on Windows.
name = "lumen_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
# The `keyring` project's core and Windows store, used directly: `keyring`'s own
# `Entry` cannot set a credential's persistence.
keyring-core = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["serde"] }
windows-native-keyring-store = "1"

# The lean settings the Milestone 0 RAM baseline was measured with, minus
# `panic = "abort"`: unwinding must stay on so RAII cleanup guards run.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
