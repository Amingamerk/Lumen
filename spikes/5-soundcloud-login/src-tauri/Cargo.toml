[package]
name = "soundcloud-login-spike"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "soundcloud_spike"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
fastrand = "2"
httpdate = "1"
keyring = "4"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "charset", "gzip", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace]
