[package]
name = "spotify-login-spike"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "spotify_login_spike"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.23"
getrandom = "0.4"
hmac = "0.13"
httpdate = "1"
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["http2", "native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[workspace]
